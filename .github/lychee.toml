# Link checker configuration (https://lychee.cli.rs)

no_progress = true
max_retries = 3
timeout = 20

# Rate limiting (429) is treated as OK so busy sites don't fail the build
accept = ["200..=299", "429"]

# Private and loopback addresses are cluster or LAN examples, not real links
exclude_all_private = true
exclude_loopback = true

exclude = [
  # Placeholders such as http://<OLLAMA_HOST_IP>:11434
  '<[A-Za-z_]+>',
  '%3C[A-Za-z_]+%3E',
]
